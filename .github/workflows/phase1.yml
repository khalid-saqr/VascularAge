name: Phase 1 rebuild qualification CI

on:
  push:
    branches: [phase-01-engine-qualification]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "jax[cpu]"
      - name: Unit and JAX tests
        run: python -m pytest -q
      - name: Static notebook and contract validation
        run: python scripts/validate_phase1_static.py
