name: VascularAge validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "jax[cpu]"

      - name: Run repository tests
        run: pytest -q

      - name: Validate retained scientific packages
        run: |
          python scripts/validate_phase1_static.py
          python scripts/phase2_validate.py
          python scripts/phase3_validate.py
          python scripts/validate_phase4_amendment001.py
          python scripts/validate_phase5_s2.py
          python scripts/validate_phase5b.py

      - name: Confirm Phase 4 biological runner remains guarded
        shell: bash
        run: |
          set +e
          output=$(python scripts/phase4_execute_locked.py \
            --expected-lock-package-sha 89321ec7c7c8909814cd8ab121726c0fcdf0ce5ec2bc44f67795759690b66963 \
            --repo-root . \
            --pwdb-root /tmp/phase4-no-source \
            --output-root /tmp/phase4-no-output 2>&1)
          code=$?
          set -e
          test "$code" -ne 0
          echo "$output" | grep -q "biological endpoint execution requires --execute-locked-trial"
          test ! -e /tmp/phase4-no-output

      - name: Confirm Phase 5 S2 runner remains guarded
        shell: bash
        run: |
          set +e
          output=$(python scripts/phase5_execute_s2.py \
            --expected-s2-lock-sha 97d831b3b3770dddcec9101f3095ecd92d190c4c9f4a1c17e67c2a6c3b8dfb05 \
            --repo-root . \
            --pwdb-root /tmp/phase5-no-source \
            --phase4-evidence-root /tmp/phase5-no-phase4 \
            --output-root /tmp/phase5-no-output 2>&1)
          code=$?
          set -e
          test "$code" -ne 0
          echo "$output" | grep -q "Phase-5 S2 biological execution requires --execute-s2"
          test ! -e /tmp/phase5-no-output

      - name: Confirm Phase 5B evidence runner remains guarded
        shell: bash
        run: |
          set +e
          output=$(python scripts/phase5b_tie_closure.py \
            --expected-lock-sha 6b9f11bf0c662c8263e531b0440882881d79b5ab70aaa4aaeffd4e4a69d741c2 \
            --repo-root . \
            --phase4-evidence-root /tmp/phase5b-no-phase4/locked_trial_amendment001_20260829T153743Z \
            --output-parent /tmp/phase5b-no-output 2>&1)
          code=$?
          set -e
          test "$code" -ne 0
          echo "$output" | grep -q "Phase-5B tie-sensitivity execution requires --execute-tie-closure"
          test ! -e /tmp/phase5b-no-output
