name: Phase 4 external execution notebook CI
on:
  push:
    branches: [phase-04-confirmatory-execution]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e . pytest
      - name: Validate Phase 4 Amendment 001 contract
        run: python scripts/validate_phase4_amendment001.py
      - name: Run repository tests
        run: pytest -q
