name: Phase 5 S2 protocol-lock CI
on:
  push:
    branches: [phase-05-s2-robustness]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e ".[test]" "jax[cpu]"
      - name: Run repository tests
        run: pytest -q
      - name: Validate Phase 5 S2 lock
        run: python scripts/validate_phase5_s2.py
      - name: Confirm S2 biological runner remains guarded
        shell: bash
        run: |
          set +e
          output=$(python scripts/phase5_execute_s2.py \
            --expected-s2-lock-sha 97d831b3b3770dddcec9101f3095ecd92d190c4c9f4a1c17e67c2a6c3b8dfb05 \
            --repo-root . \
            --pwdb-root /tmp/phase5-no-source \
            --phase4-evidence-root /tmp/phase5-no-phase4 \
            --output-root /tmp/phase5-no-output 2>&1)
          code=$?
          set -e
          test "$code" -ne 0
          echo "$output" | grep -q "Phase-5 S2 biological execution requires --execute-s2"
          test ! -e /tmp/phase5-no-output
